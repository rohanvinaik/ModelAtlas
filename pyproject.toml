[project]
name = "model-atlas"
version = "0.4.3"
description = "MCP server exposing a navigable semantic network of ML models"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "huggingface-hub>=0.20.0",
    "rapidfuzz>=3.0.0",
    "markdown>=3.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    # Stub-only packages. `yaml` and `requests` are imported by first-party
    # code, so without these mypy reports import-untyped and stops resolving
    # anything downstream of them.
    "types-PyYAML",
    "types-requests",
]
# Behavioural analysis. Not in `dev` because a full mutation pass is minutes,
# not seconds — this is for deliberate use on a function you are about to
# change, not part of the normal edit loop:
#   uv sync --extra analysis
#   uv run detective regime                       # resolve the testing regime
#   uv run detective diagnose path/to.py::func    # what is unpinned
# Marker-gated: detective-spec needs >=3.11, the package supports >=3.10. A
# dev-only analysis tool must not narrow what ModelAtlas itself runs on.
analysis = [
    "detective-spec>=0.8.1; python_version >= '3.11'",
]
ingest = [
    "outlines>=0.1.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "openai>=1.0.0",
    "datasets>=2.0.0",
]

[project.scripts]
model-atlas = "model_atlas.server:main"
model-atlas-ingest = "model_atlas.ingest_cli:main"

[tool.pytest.ini_options]
markers = ["detective: test generated by Detective"]
# Scope discovery to `tests/` so pytest never walks the mutants/ shadow tree
# mutmut creates. Both trees have a `tests/conftest.py`, and default rootdir
# discovery would try to import both as `tests.conftest` → ImportPathMismatchError,
# which cascades into ImportErrors across `tests/generated/` and (via Wesker's
# session-abort semantics) makes Detective report "no live pytest session".
testpaths = ["tests"]
# `testpaths` only applies when pytest is called without explicit path args.
# Wesker's live-suite seam passes explicit paths (its reachability set, or "."),
# so testpaths is bypassed there. `norecursedirs` is the ONE knob pytest honors
# even with explicit paths — it prunes during recursion. Without this, an audit
# through Detective still walks into `mutants/` and re-hits the duplicate-conftest
# ImportPathMismatchError even though the CLI path is fine.
norecursedirs = ["mutants", ".venv", "venv", "build", "dist", ".git"]

[tool.mutmut]
paths_to_mutate = ["src/"]
tests_dir = ["tests/"]

[tool.ruff]
src = ["src", "tests"]
exclude = ["mutants", "deploy", ".claude"]

[tool.ruff.lint.per-file-ignores]
"tests/generated/*.py" = ["F401", "F811", "E402"]

[tool.mypy]
# src-layout + editable install: site-packages carries a .pth pointing at
# `src/`, so mypy can reach every module by two names at once. With namespace
# packages on (mypy's default since 0.990) the bare `src/` directory also
# counts as a package root, and the same file resolves as BOTH
# `model_atlas.x` and `src.model_atlas.x` — "Source file found twice under
# different module names", which aborts the run before type checking starts.
# `mypy_path` fixes the package base at `src/`; `namespace_packages = false`
# stops `src/` (no __init__.py) from being a second one. Keep both.
files = ["src/model_atlas", "tests"]
mypy_path = "src"
namespace_packages = false
exclude = ["^mutants/", "^deploy/", "^\\.claude/"]

# Optional heavy dependencies. These live in the `ingest` extra and are absent
# from a `--extra dev` environment by design — the ingest workers run on
# separate machines. Ignoring their missing stubs is scoped per-module so a
# genuinely missing FIRST-party import still fails the run.
[[tool.mypy.overrides]]
module = ["outlines.*", "transformers.*", "torch.*", "datasets.*", "openai.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["mutants", "deploy", ".claude", "tests"]

[tool.coverage.run]
source = ["src/model_atlas"]
omit = [
    # Worker scripts — standalone, no ModelAtlas imports, run on remote machines
    "src/model_atlas/phase_c_worker.py",
    "src/model_atlas/phase_c1_worker.py",
    "src/model_atlas/phase_c1_extended.py",
    "src/model_atlas/phase_c3_worker.py",
    "src/model_atlas/phase_d_worker.py",
    # CLI entry points — argparse + orchestration, tested via integration
    "src/model_atlas/ingest_cli.py",
    "src/model_atlas/ingest.py",
    "src/model_atlas/ingest_seed.py",
    "src/model_atlas/ingest_vibes.py",
    # External API dependencies — require HF/Ollama/datasets at runtime
    "src/model_atlas/sources/huggingface.py",
    "src/model_atlas/sources/ollama.py",
    "src/model_atlas/sources/base.py",
    "src/model_atlas/ground_truth.py",
    "src/model_atlas/search/structured.py",
    # Wiki CLI
    "src/model_atlas/wiki/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.wesker]
source_dir = "src/model_atlas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
